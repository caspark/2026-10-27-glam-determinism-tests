# Snapshot of the game's Clippy config used for the negative lint probe
# Raw reference calls in main.rs are intentional

disallowed-macros = [
    { path = "std::print", reason = "use info logging macro instead" },
    { path = "std::println", reason = "use info logging macro instead" },
    { path = "std::eprint", reason = "use error logging macro instead" },
    { path = "std::eprintln", reason = "use error logging macro instead" },
]

